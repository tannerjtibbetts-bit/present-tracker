# Checks the app on every push: code check, tests, then an Android and an iPhone build.
# The Android APK is kept as a download on the run's page. Signed App Store builds are made by Codemagic.
name: App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PresentTracker-android
          path: build/app/outputs/flutter-apk/app-release.apk
      # Keeps the newest Android app on the "apk" branch too, so it can be fetched with git.
      - name: Save the app on the apk branch
        run: |
          mkdir -p /tmp/apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/PresentTracker.apk
          cd /tmp/apk
          git init -q -b apk
          git add PresentTracker.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Android app from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
